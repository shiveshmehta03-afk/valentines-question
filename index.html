<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Be My Valentine?</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffebee;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            text-align: center;
        }
        .container {
            position: relative;
            z-index: 1;
        }
        img {
            width: 200px;
            height: auto;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        h1 {
            color: #d32f2f;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.2s;
        }
        #yesBtn {
            background-color: #4CAF50;
            color: white;
        }
        #noBtn {
            background-color: #f44336;
            color: white;
            position: relative;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div id="questionPage">
        <img src="https://media.giphy.com/media/c76IJLufpN2G6n37i8/giphy.gif" alt="Cute bear">
        <h1>Will you be my valentine?</h1>
        <div class="btn-group">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <div id="successPage" class="hidden">
        <img src="https://media.giphy.com/media/KztT2c4u8mYYUiCiS7/giphy.gif" alt="Happy bear">
        <h1>I knew you would say yes!! ❤️</h1>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const questionPage = document.getElementById('questionPage');
        const successPage = document.getElementById('successPage');

        let scale = 1;

        // Function to move the NO button
        function moveNoButton() {
            // Calculate random coordinates
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.position = 'absolute';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            // Make YES button bigger
            scale += 0.4;
            yesBtn.style.transform = `scale(${scale})`;
        }

        // Move button on hover OR touch (for mobile)
        noBtn.addEventListener('mouseenter', moveNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevents clicking
            moveNoButton();
        });

        // Show success page
        yesBtn.addEventListener('click', () => {
            questionPage.classList.add('hidden');
            successPage.classList.remove('hidden');
        });
    </script>
</body>
</html>
